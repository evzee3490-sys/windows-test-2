name: Temporary Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: Create RDP Admin User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "rdpuser"
          }

          New-LocalUser -Name "rdpuser" -Password $Password -PasswordNeverExpires -AccountNeverExpires -Description "Temporary RDP administrator"

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser"
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Show RDP Details
        shell: powershell
        run: |
          $ip = (tailscale ip -4).Trim()
          Write-Host "=========================================="
          Write-Host "       TEMPORARY RDP READY"
          Write-Host "=========================================="
          Write-Host "Tailscale IP : $ip"
          Write-Host "RDP Username : rdpuser"
          Write-Host "RDP Port     : 3389"
          Write-Host "Administrator: YES"
          Write-Host "=========================================="

      - name: Keep RDP Alive
        shell: powershell
        run: |
          Write-Host "RDP is running. Leave this workflow running."
          while ($true) {
            Start-Sleep -Seconds 60
          }
