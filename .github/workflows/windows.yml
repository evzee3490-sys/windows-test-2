name: Temporary Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "rdpuser"
          }

          New-LocalUser `
            -Name "rdpuser" `
            -Password $Password `
            -PasswordNeverExpires `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "rdpuser"

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Get RDP IP
        shell: powershell
        run: |
          $ip = tailscale ip -4
          echo "===================================="
          echo "Tailscale IP: $ip"
          echo "RDP Username: rdpuser"
          echo "RDP Port: 3389"
          echo "===================================="

      - name: Keep RDP Alive
        shell: powershell
        run: |
          Write-Host "RDP IS READY"
          Write-Host "Keep this workflow running."
          
          while ($true) {
              Start-Sleep -Seconds 60
          }
